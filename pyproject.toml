[project]
name = "codex-airline-ui-testing"
version = "0.1.0"
description = "A local flight-search app built with Flask."
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-playwright==0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["browser: tests that require a Playwright browser runtime"]
