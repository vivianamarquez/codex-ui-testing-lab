[project]
name = "codex-ui-testing-lab"
version = "0.1.0"
description = "A local flight-search app built with Flask."
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--browser chromium --tracing retain-on-failure --screenshot only-on-failure"
